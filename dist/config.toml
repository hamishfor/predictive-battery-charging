# pbcd settings. All optional; defaults shown. Uncomment to change, then:
#   sudo systemctl restart pbcd

## Mode

# "control": hold below full once your routine is learned, then charge to
# 100% before you usually unplug. "collect": record only, never limit.
# mode = "control"

# Use GNOME Settings → Power → Battery Charging as the on/off switch
# ("Preserve Battery Health" = on). If false, pbcd pauses while GNOME's limit is on.
# upower_switch = true

## Charge limit

# Hold range. Confident predictions hold at hold_min, weaker ones higher.
# hold_min = 70
# hold_max = 99

# Step up to this level within 3 hours of a predicted unplug.
# ready_pct = 90

# Never charge past this level. It replaces 100% as the final charge, and caps
# the hold range. "Charge to full" still goes to 100%, for that plug-in only.
# max_pct = 100

# Always charge below this level.
# floor_pct = 25

## Predictions

# Ignore predictions below this confidence (0 to 1).
# min_confidence = 0.3

# Start the final charge this many minutes early.
# margin_min = 15

# Be full by these times. One [[schedule]] block per rule.
# [[schedule]]
# days = ["mon", "tue", "wed", "thu", "fri"]
# full_by = "08:00"

## Sleep and power off

# Wake briefly during sleep to finish charging: "auto", "on" or "off".
# "auto" uses it on tested models and after `sudo pbcctl selftest`.
# quiet_wake = "auto"

# Also try it on untested models, until a self-check fails.
# quiet_wake_try_untested = false

# Start the final charge before sleeping if it's due within this many minutes.
# presleep_window_min = 30

# Without a quiet wake: "full" charges before sleep, "hold" keeps holding.
# sleep_fallback = "full"

# Limit kept while powered off: "hold" or "full".
# shutdown = "hold"

# Alert if charging hasn't resumed this many seconds after a release.
# resume_grace_s = 300

## Data

# db = "/var/lib/pbcd/pbcd.db"
# sample_interval_s = 60
# sample_retention_days = 1096

# Unplugging for less than this many seconds doesn't end a session.
# merge_gap_s = 300
