<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Install to /usr/share/dbus-1/system.d/ -->
<busconfig>
  <policy user="root">
    <allow own="org.pbc.Daemon1"/>
  </policy>
  <!-- Anyone may call the daemon. Methods that change charging are checked with polkit inside the daemon. -->
  <policy context="default">
    <allow send_destination="org.pbc.Daemon1" send_interface="org.pbc.Daemon1"/>
    <allow send_destination="org.pbc.Daemon1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.pbc.Daemon1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.pbc.Daemon1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
