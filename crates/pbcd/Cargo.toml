[package]
name = "pbcd"
description = "Predictive battery charging daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "../build-version.rs"

[[bin]]
name = "pbcd"
path = "src/main.rs"

[[bin]]
name = "pbcd-sleep-hook"
path = "src/bin/pbcd-sleep-hook.rs"

[dependencies]
pbc-hw = { path = "../pbc-hw" }
pbc-model = { path = "../pbc-model" }
pbc-store = { path = "../pbc-store" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
jiff.workspace = true
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
