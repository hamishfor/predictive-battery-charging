name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cargo rustc rustfmt rust-clippy shellcheck
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Shellcheck the installers
        run: shellcheck -S warning dist/*.sh extension/*.sh packaging/*.sh

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cargo rustc gjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked
      - name: Extension tests
        run: gjs -m extension/tests/status-test.js

  # The oldest Rust that Cargo.toml's rust-version promises to build with.
  msrv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.89
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.89
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo check --workspace --all-targets --locked

  # Build the .deb as a release would, and check it installs.
  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cargo rustc zip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: packaging/build-deb.sh
      - name: Check the package installs
        run: |
          sudo apt-get install -y ./dist-out/*.deb
          pbcctl --version
          systemctl cat pbcd.service >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist-out/
          retention-days: 7
