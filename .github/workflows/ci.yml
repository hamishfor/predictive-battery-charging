name: CI

# Every push to main and every pull request. On main, the release job then
# publishes the package if the workspace version in Cargo.toml isn't tagged yet.
# Run it from the Actions tab to retry a failed release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main never
# cancel, so a release is never stopped half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cargo rustc rustfmt rust-clippy shellcheck
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Shellcheck the installers
        run: shellcheck -S warning dist/*.sh extension/*.sh packaging/*.sh

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cargo rustc gjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked
      - name: Extension tests
        run: gjs -m extension/tests/status-test.js

  # The oldest Rust that Cargo.toml's rust-version promises to build with.
  msrv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.89
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.89
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo check --workspace --all-targets --locked

  # Build the .deb and extension zip, and check the .deb installs. The release
  # job publishes these exact files.
  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cargo rustc zip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: packaging/build-deb.sh
      - name: Check the package installs
        run: |
          sudo apt-get install -y ./dist-out/*.deb
          pbcctl --version
          systemctl cat pbcd.service >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist-out/
          retention-days: 7

  # Publish the package the job above built and tested. Only on main, and only
  # when v<version> isn't tagged yet, so other changes to Cargo.toml don't release.
  release:
    needs: [lint, test, msrv, package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          # A version with a suffix, such as 0.3.0-rc.1, is a pre-release.
          case "$version" in *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          name: packages
          path: dist-out/
      - name: Tag and publish
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        # --target creates the tag on this commit.
        run: |
          gh release create "$TAG" dist-out/*.deb dist-out/*.zip \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes $PRERELEASE

  # Rebuild the apt repository on GitHub Pages from every non-pre-release .deb,
  # so apt upgrade picks up the new release and older versions stay installable.
  # Run from the Actions tab to republish without a new release.
  apt-repo:
    needs: release
    if: needs.release.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils
      - name: Download the released packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName -q '.[].tagName' |
            while read -r tag; do gh release download "$tag" -p '*.deb' -D debs; done
      - name: Build the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          packaging/build-apt-repo.sh debs apt-repo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo
      - uses: actions/deploy-pages@v4
        id: deploy
